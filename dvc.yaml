stages:
  generar_datos:
    cmd: python pipeline/generar_datos.py
    deps:
      - pipeline/generar_datos.py
      - pipeline/common.py
      - warehouse_rush/env_v1.py
    params:
      - datos
    outs:
      - data/pedidos_entrenamiento.json
      - data/pedidos_evaluacion.json

  entrenar:
    cmd: python pipeline/entrenar.py
    deps:
      - pipeline/entrenar.py
      - pipeline/common.py
      - warehouse_rush/env_v1.py
      - warehouse_rush/agent.py
      - data/pedidos_entrenamiento.json
    params:
      - datos.paquetes_por_pedido
      - entorno
      - agente
      - entrenamiento
    outs:
      - models/q_table_v1.pkl
    plots:
      - metrics/entrenamiento.csv:
          cache: false

  evaluar:
    cmd: python pipeline/evaluar.py
    deps:
      - pipeline/evaluar.py
      - pipeline/common.py
      - warehouse_rush/env_v1.py
      - data/pedidos_evaluacion.json
      - models/q_table_v1.pkl
    params:
      - datos.paquetes_por_pedido
      - entorno
    outs:
      - data/trayectorias_evaluacion.csv
    metrics:
      - metrics/evaluacion.json:
          cache: false

plots:
  - tasa_de_exito:
      template: linear
      x: episodio
      y:
        metrics/entrenamiento.csv: [tasa_exito]
  - rescates_por_episodio:
      template: linear
      x: episodio
      y:
        metrics/entrenamiento.csv: [rescates_medios]
  - recompensa_media:
      template: linear
      x: episodio
      y:
        metrics/entrenamiento.csv: [recompensa_media]
