# Criterios de seleccion fijados ANTES de entrenar los finalistas (el commit de este archivo lo demuestra).
# Los aplica pipeline/comparar_finalistas.py; no se cambian despues de ver los resultados.

fijado: "2026-11-06"

# Contraste principal: recuperacion del incidente del nivel N3 (pasillo bloqueado).
contrastes:
  contraste-n3:
    nivel: n3
    pregunta: >-
      Tras el incidente, ¿conviene reentrenar desde cero en N3 o continuar desde el modelo de N2
      con exploracion completa, que usa menos episodios?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: desde cero
        cambios: [nivel=n3]
        hipotesis: >-
          Entrenar desde cero en N3 con el mismo presupuesto que N2 (40000 episodios) alcanza >=95% de exito
          en las tres semillas.
      B:
        nombre: continuar desde N2 con exploracion completa
        desde: pipeline-n2
        cambios: [nivel=n3, entrenamiento.episodios=25000, agente.epsilon_inicial=1.0]
        hipotesis: >-
          Continuar desde el modelo de N2 con epsilon inicial 1.0 alcanza >=95% de exito en N3 con 25000
          episodios (62% del presupuesto desde cero), corrigiendo la intervencion rechazada (epsilon 0.3, 23.6%).

  # Ambiente v2.0.0 (negocio): medicion de estabilidad con 3 semillas, fijada antes de entrenar (2026-11-13).
  # Corridas exploratorias previas (una semilla, 80000 episodios) dieron entre 73.6% y 99.8% de exito.
  medicion-v2-n2:
    nivel: v2-n2
    pregunta: >-
      ¿Q-learning tabular aprende de forma estable el centro de distribucion (N2, recompensa en COP y SLA) con
      80000 episodios, el doble que v1 porque el servicio duplica los estados?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: Q-learning, 80000 episodios
        cambios: [nivel=v2-n2, entrenamiento.episodios=80000]
        hipotesis: >-
          Con 80000 episodios Q-learning alcanza >=95% de ordenes completas en v2-n2 en las tres semillas.
  medicion-v2-n3:
    nivel: v2-n3
    pregunta: >-
      ¿Q-learning tabular aprende de forma estable el centro de distribucion con el pasillo bloqueado (N3) con
      80000 episodios?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: Q-learning, 80000 episodios
        cambios: [nivel=v2-n3, entrenamiento.episodios=80000]
        hipotesis: >-
          Con 80000 episodios Q-learning alcanza >=95% de ordenes completas en v2-n3 en las tres semillas.

  # PPO con red neuronal (fijado 2026-11-13, antes de entrenar). Q-learning no cumplio en v2-n2 (93.8% +- 7.2,
  # rescates 0.42) ni en v2-n3 (75.7% +- 20.1, rescates 0.59): la tabla no observa el plazo restante del SLA ni la
  # bateria exacta. La red recibe 22 caracteristicas que si los incluyen (warehouse_rush/ppo.py). Un piloto de una
  # semilla llego a 90% de exito con 500k pasos y se detuvo; no se usa para elegir nada.
  ppo-v2-n2:
    nivel: v2-n2
    pregunta: >-
      ¿Una politica PPO (red 128x128, 22 caracteristicas) entrenada 3 millones de pasos cumple los requisitos en
      el centro de distribucion N2 de forma estable en tres semillas, donde Q-learning no los cumplio?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: PPO red neuronal, 3M pasos
        algoritmo: ppo
        pasos: 3000000
        cambios: [nivel=v2-n2, algoritmo=ppo, entrenamiento.pasos=3000000]
        hipotesis: >-
          Con 3 millones de pasos PPO alcanza >=95% de ordenes completas con <=0.30 rescates en v2-n2 en las tres
          semillas.
  ppo-v2-n3:
    nivel: v2-n3
    pregunta: >-
      ¿Una politica PPO (red 128x128, 22 caracteristicas) entrenada 3 millones de pasos cumple los requisitos en
      el centro de distribucion N3 (pasillo bloqueado) de forma estable en tres semillas?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: PPO red neuronal, 3M pasos
        algoritmo: ppo
        pasos: 3000000
        cambios: [nivel=v2-n3, algoritmo=ppo, entrenamiento.pasos=3000000]
        hipotesis: >-
          Con 3 millones de pasos PPO alcanza >=95% de ordenes completas con <=0.30 rescates en v2-n3 en las tres
          semillas.

  # Imitacion del planificador de reglas (fijado 2026-11-13, antes de entrenar). PPO desde cero no cumplio
  # (ppo-v2-n2: 63.5% +- 55.2; ppo-v2-n3: 0%): 4 de 6 redes se quedaron quietas porque no moverse es lo mas barato
  # al inicio. La politica de reglas logra 100% de exito y 0 rescates en ambas suites, asi que sirve de maestro.
  # Misma red (128x128, 22 caracteristicas) y mismo formato de modelo que PPO.
  # Nota: segun la regla de seleccion, si los dos brazos cumplen y difieren en menos de 0.01 de exito, gana el de
  # menor presupuesto (A). B solo gana si mejora la tasa de exito en 0.01 o mas.
  imitacion-v2-n2:
    nivel: v2-n2
    pregunta: >-
      ¿Una red neuronal pre-entrenada imitando al planificador de reglas (DAgger) cumple los requisitos de forma
      estable en N2 de negocio, y el afinamiento posterior con PPO la mejora?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: imitacion DAgger
        algoritmo: imitacion
        pasos: 0
        cambios: [nivel=v2-n2, algoritmo=imitacion, imitacion.iteraciones_dagger=8, imitacion.episodios_por_iteracion=1500]
        hipotesis: >-
          La red entrenada por imitacion (DAgger, 8 iteraciones de 1500 pedidos) alcanza >=95% de ordenes completas
          con <=0.30 rescates en v2-n2 en las tres semillas.
      B:
        nombre: imitacion DAgger + afinamiento PPO 1M pasos
        algoritmo: imitacion+ppo
        pasos: 1000000
        ppo: {learning_rate: 0.00005, ent_coef: 0.0, clip_range: 0.1}
        cambios: [nivel=v2-n2, algoritmo=imitacion+ppo, ppo.learning_rate=5e-5, ppo.ent_coef=0, ppo.clip_range=0.1]
        hipotesis: >-
          Afinar con PPO (1M pasos, tasa de aprendizaje baja) la red imitada mantiene >=95% de exito y <=0.30 rescates
          en las tres semillas y mejora el OTIF respecto de A.
  imitacion-v2-n3:
    nivel: v2-n3
    pregunta: >-
      ¿Una red neuronal pre-entrenada imitando al planificador de reglas (DAgger) cumple los requisitos de forma
      estable en N3 de negocio (pasillo bloqueado), y el afinamiento posterior con PPO la mejora?
    semillas: [0, 1, 2]
    brazos:
      A:
        nombre: imitacion DAgger
        algoritmo: imitacion
        pasos: 0
        cambios: [nivel=v2-n3, algoritmo=imitacion, imitacion.iteraciones_dagger=8, imitacion.episodios_por_iteracion=1500]
        hipotesis: >-
          La red entrenada por imitacion (DAgger, 8 iteraciones de 1500 pedidos) alcanza >=95% de ordenes completas
          con <=0.30 rescates en v2-n3 en las tres semillas.
      B:
        nombre: imitacion DAgger + afinamiento PPO 1M pasos
        algoritmo: imitacion+ppo
        pasos: 1000000
        ppo: {learning_rate: 0.00005, ent_coef: 0.0, clip_range: 0.1}
        cambios: [nivel=v2-n3, algoritmo=imitacion+ppo, ppo.learning_rate=5e-5, ppo.ent_coef=0, ppo.clip_range=0.1]
        hipotesis: >-
          Afinar con PPO (1M pasos, tasa de aprendizaje baja) la red imitada mantiene >=95% de exito y <=0.30 rescates
          en las tres semillas y mejora el OTIF respecto de A.

# Requisitos que debe cumplir la media de las semillas de un brazo (suite de evaluacion del nivel).
requisitos:
  tasa_exito_min: 0.95
  fragiles_rotos_medios_max: 0.05
  rescates_medios_max: 0.30

# Seleccion entre brazos que cumplen los requisitos.
seleccion:
  - mayor media de tasa_exito
  - si la diferencia es menor a 0.01: menor presupuesto (episodios)
  - si persiste el empate: menor media de pasos_medios_exitosos

# Modelo a publicar del brazo ganador: la semilla con mayor tasa_exito (empate: menos pasos).
modelo_publicado: mejor semilla del brazo ganador

# Promocion a recomendado del nivel: solo si el modelo cumple los requisitos y no empeora mas de 0.005 la
# tasa_exito del recomendado actual del nivel en la misma suite.
promocion:
  tolerancia_tasa_exito: 0.005

# Test final reservado: suite de 500 pedidos de N3 con una semilla secreta (no esta en el repositorio publico;
# solo se publica el hash de sus casos). Se evalua UNA vez, despues de elegir, y no se usa para ajustar nada.
test_reservado:
  casos: 500
