# Niveles de dificultad de Warehouse Rush (ambiente WarehouseRush-v1).
# Cambiar las reglas o recompensas de env_v1.py exige subir version_ambiente.
# Los modelos solo son compatibles con niveles de su misma familia (mismas dimensiones de observacion/accion).

version_ambiente: "1.0.0"

niveles:
  n1:
    nombre: "N1 · Misión base"
    decision: "Recoger un paquete normal y llevarlo a su zona. Sin batería ni obstáculos."
    entorno:
      bateria: false
      bateria_max: 100
      max_pasos: 200
      bloqueos: []
    datos:
      semilla: 7
      pedidos_entrenamiento: 5000
      pedidos_evaluacion: 200
      paquetes_por_pedido: 1
      prob_tipos: {normal: 1.0, pesado: 0.0, fragil: 0.0}

  n2:
    nombre: "N2 · Más decisiones"
    decision: >-
      Pedidos de 3 paquetes en orden, tres zonas de entrega, paquetes pesados (más batería) y frágiles
      (se rompen al chocar), y batería con estación de carga: decidir cuándo cargar.
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 400
      bloqueos: []
    datos:
      semilla: 42
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}

  n3:
    nombre: "N3 · Operación exigente"
    decision: >-
      Incidente: el corredor inferior está bloqueado en la entrada de dos pasillos (casillas (7,4) y (7,7)).
      El agente debe recuperarse buscando rutas alternativas por el corredor superior.
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 400
      bloqueos: [[7, 4], [7, 7]]
    datos:
      semilla: 43
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}

  # ---------------------------------------------------------------- ambiente v2.0.0 (negocio)
  # Centro de distribucion de paqueteria: recompensa en pesos colombianos (utilidad de la operacion) y
  # servicio Express/Estandar con plazo (SLA). Mismos mapas que N1-N3; nueva familia de modelos.

  v2-n1:
    nombre: "N1 · Misión base (negocio)"
    ambiente: WarehouseRush-v2
    version_ambiente: "2.0.0"
    decision: >-
      Despachar un paquete al muelle de su ruta. 30% son Express (tarifa de $24.000, plazo de 40 pasos);
      el resto Estándar ($11.000, plazo de 100 pasos). Sin batería ni obstáculos.
    entorno:
      bateria: false
      bateria_max: 100
      max_pasos: 200
      bloqueos: []
    datos:
      semilla: 107
      pedidos_entrenamiento: 5000
      pedidos_evaluacion: 200
      paquetes_por_pedido: 1
      prob_tipos: {normal: 1.0, pesado: 0.0, fragil: 0.0}
      prob_express: 0.3

  v2-n2:
    nombre: "N2 · Más decisiones (negocio)"
    ambiente: WarehouseRush-v2
    version_ambiente: "2.0.0"
    decision: >-
      Órdenes de 3 paquetes con servicio Express o Estándar: cumplir el plazo de los Express ($13.000 de
      compensación si llegan tarde), no romper frágiles ($60.000 de indemnización) y decidir cuándo cargar la
      batería (cada rescate cuesta $8.000 de un técnico).
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 400
      bloqueos: []
    datos:
      semilla: 142
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}
      prob_express: 0.3

  v2-n3:
    nombre: "N3 · Operación exigente (negocio)"
    ambiente: WarehouseRush-v2
    version_ambiente: "2.0.0"
    decision: >-
      Incidente en el centro de distribución: el corredor inferior está bloqueado en (7,4) y (7,7). Las rutas
      alternativas son más largas y ponen en riesgo el plazo de los Express.
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 400
      bloqueos: [[7, 4], [7, 7]]
    datos:
      semilla: 143
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}
      prob_express: 0.3

  # ---------------------------------------------------------------- ambiente v3.0.0 (dos pisos y hora de corte)
  # El centro de distribucion crece a dos pisos con las mismas estanterias, unidos por un montacargas (8 pasos por
  # viaje). Cada ruta tiene un camion con hora de corte: el paquete que llega despues sale al dia siguiente.
  # Plazos del SLA: Estandar 150 pasos, Express 90 (env_v3.py). Calibrados con el planificador de reglas
  # (docs/ficha_ambiente.md, seccion v3). Nueva familia de modelos (posicion con piso y accion montacargas).

  v3-n1:
    nombre: "N1 · Dos pisos (negocio)"
    ambiente: WarehouseRush-v3
    version_ambiente: "3.0.0"
    decision: >-
      Despachar un paquete que puede estar en cualquiera de los dos pisos: si está arriba, subir por el montacargas,
      recogerlo y bajarlo al muelle de su ruta antes de que salga el camión (entre 60 y 200 pasos). Sin batería.
    entorno:
      bateria: false
      bateria_max: 100
      max_pasos: 300
      bloqueos: []
    datos:
      semilla: 207
      pedidos_entrenamiento: 5000
      pedidos_evaluacion: 200
      paquetes_por_pedido: 1
      prob_tipos: {normal: 1.0, pesado: 0.0, fragil: 0.0}
      prob_express: 0.3
      corte_pasos: [60, 200]

  v3-n2:
    nombre: "N2 · Dos pisos y hora de corte (negocio)"
    ambiente: WarehouseRush-v3
    version_ambiente: "3.0.0"
    decision: >-
      Órdenes de 3 paquetes repartidos en dos pisos, secuenciadas por la salida del camión de cada ruta (entre 120
      y 360 pasos). Perder el camión cuesta la compensación al cliente más $3.750 de reproceso. La única estación
      de carga está en el primer piso: cargar en el momento equivocado puede hacer perder un camión.
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 600
      bloqueos: []
    datos:
      semilla: 242
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}
      prob_express: 0.3
      corte_pasos: [120, 360]

  v3-n3:
    nombre: "N3 · Dos pisos con incidente (negocio)"
    ambiente: WarehouseRush-v3
    version_ambiente: "3.0.0"
    decision: >-
      El mismo incidente de N3 en los dos pisos: el corredor inferior está bloqueado en (7,4) y (7,7) del piso 1 y
      del piso 2. Los desvíos alargan cada viaje y ponen en riesgo la hora de corte de los camiones.
    entorno:
      bateria: true
      bateria_max: 100
      max_pasos: 600
      bloqueos: [[0, 7, 4], [0, 7, 7], [1, 7, 4], [1, 7, 7]]
    datos:
      semilla: 243
      pedidos_entrenamiento: 20000
      pedidos_evaluacion: 500
      paquetes_por_pedido: 3
      prob_tipos: {normal: 0.5, pesado: 0.25, fragil: 0.25}
      prob_express: 0.3
      corte_pasos: [120, 360]
