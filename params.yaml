# Parametros del pipeline de DVC (versionados con git; DVC los usa para saber que etapas repetir).
# El ambiente y el dataset de cada nivel estan en configs/niveles.yaml.
# Para un experimento registrado en MLflow: ./experimentar.py -e nombre agente.alpha=0.2

nivel: v2-n2  # nivel oficial: ambiente v2.0.0 (negocio, COP y SLA)

agente:
  alpha: 0.1
  gamma: 0.99
  epsilon_min: 0.05
  fraccion_exploracion: 0.7 # epsilon llega a su minimo en esta fraccion del entrenamiento

entrenamiento:
  episodios: 40000
  semilla: 0
  registrar_cada: 1000 # cada cuantos episodios se registran las curvas
  casos_curva: 50 # casos de la suite de evaluacion usados para la curva sin exploracion
